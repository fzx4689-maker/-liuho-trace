<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>六禾蔬果｜我是誰</title>

  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f8f3;
      margin: 0;
      color: #333;
    }

    .header {
      background: #4f8a45;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
    }

    .card {
      max-width: 650px;
      margin: 20px auto;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .title {
      color: #4f8a45;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .product-image {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .row {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      line-height: 1.7;
    }

    .label {
      font-weight: bold;
      color: #4f8a45;
    }

    .section {
      margin-top: 25px;
    }

    .section h2 {
      color: #4f8a45;
      font-size: 21px;
    }

    .section p {
      line-height: 1.8;
    }

    .recipe-image {
      width: 100%;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
    }

    .footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    #loading {
      text-align: center;
      padding: 50px;
    }
body::before {
  content: "六禾蔬果";
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-25deg);
  font-size: 72px;
  font-weight: bold;
  color: rgba(76, 140, 68, 0.08);
  white-space: nowrap;
  pointer-events: none;
  z-index: 9999;
}
  </style>
</head>

<body>

  <div class="header">
    <h1>六禾蔬果</h1>
    <p>新鮮・安心・產地直送</p>
  </div>
<div id="productBrowser" style="max-width:720px;margin:16px auto;padding:0 16px;">
  <input
    id="productSearch"
    type="search"
    placeholder="🔍 搜尋蔬菜"
    style="width:100%;padding:12px 14px;border:1px solid #ccc;border-radius:10px;font-size:16px;box-sizing:border-box;"
  >

  <div style="display:flex;gap:8px;overflow-x:auto;padding:12px 0;white-space:nowrap;">
    <button class="categoryBtn" data-category="全部">全部</button>
    <button class="categoryBtn" data-category="大宗菜">大宗菜</button>
    <button class="categoryBtn" data-category="葉菜類">葉菜類</button>
    <button class="categoryBtn" data-category="花果類">花果類</button>
    <button class="categoryBtn" data-category="根莖類">根莖類</button>
    <button class="categoryBtn" data-category="菇類">菇類</button>
    <button class="categoryBtn" data-category="辛香料">辛香料</button>
    <button class="categoryBtn" data-category="生菜類">生菜類</button>
    <button class="categoryBtn" data-category="玉米跟筍類">玉米跟筍類</button>
  </div>

  <div id="productList"></div>
</div>
  <div id="loading">資料讀取中...</div>

  <div class="card" id="content" style="display:none;">

    <div class="title">我是誰</div>

    <img id="productImage" class="product-image">

    <div class="row">
      <span class="label">品種：</span>
      <span id="variety"></span>
    </div>

    <div class="row">
      <span class="label">產地：</span>
      <span id="origin"></span>
    </div>

    <div class="row">
      <span class="label">保存方式：</span>
      <span id="storage"></span>
    </div>

    <div class="section">
      <h2>🥬 蔬菜特性</h2>
      <p id="features"></p>
    </div>

    <div class="section">
      <h2>🌱 營養特色</h2>
      <p id="nutrition"></p>
    </div>

    <div class="section">
      <h2>🍳 推薦料理</h2>
      <p id="recipes"></p>
      <img id="recipeImage" class="recipe-image">
    </div>

  </div>

  <div class="footer">
    六禾蔬果｜新鮮・安心・產地直送
  </div>

<script>

const SUPABASE_URL =
"https://nivlimhmzgpmgztzppgr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_n2ftnUjtUl-URAfuY-sUEQ_SEfC6iAt";

async function loadProduct() {

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id") || "3";

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/products?id=eq.${id}&select=*`,
      {
        headers: {
          "apikey": SUPABASE_KEY
        }
      }
    );

    const data = await response.json();

    if (!data.length) {
      document.getElementById("loading").innerText =
        "找不到這筆資料";
      return;
    }

    const p = data[0];

    document.getElementById("variety").innerText =
      p.variety || "—";

    document.getElementById("origin").innerText =
      p.origin || "—";

    document.getElementById("storage").innerText =
      p.storage || "—";

    document.getElementById("features").innerText =
      p.features || "—";

    document.getElementById("nutrition").innerText =
      p.nutrition || "—";

    document.getElementById("recipes").innerText =
      p.recipes || "—";

    const productImage = document.getElementById("productImage");
    if (p.image_url) {
      productImage.src = p.image_url;
      productImage.style.display = "block";
    }

    const recipeImage = document.getElementById("recipeImage");
    if (p.recipe_image_url) {
      recipeImage.src = p.recipe_image_url;
      recipeImage.style.display = "block";
    }

    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";

  } catch (error) {

    document.getElementById("loading").innerText =
      "資料讀取失敗，請稍後再試";

  }
}

loadProduct();
const pageParams = new URLSearchParams(window.location.search);
const pageProductId = pageParams.get("id");
if (pageProductId) {
  document.getElementById("productList").style.display = "none";
}

  let allProducts = [];
let activeCategory = "全部";

async function loadProductBrowser() {
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/products?select=id,variety,origin,category,image_url&order=id.asc`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) throw new Error("讀取商品失敗");

    allProducts = await response.json();
    renderProductList();
  } catch (error) {
    document.getElementById("productList").innerHTML =
      '<div style="padding:10px;color:#888;">蔬菜清單讀取失敗</div>';
  }
}

function renderProductList() {
  const keyword =
    document.getElementById("productSearch").value.trim().toLowerCase();

  const filtered = allProducts.filter(product => {
    const matchCategory =
      activeCategory === "全部" || product.category === activeCategory;

    const matchKeyword =
      !keyword ||
      (product.variety || "").toLowerCase().includes(keyword) ||
      (product.origin || "").toLowerCase().includes(keyword);

    return matchCategory && matchKeyword;
  });

  const list = document.getElementById("productList");

  if (filtered.length === 0) {
    list.innerHTML =
      '<div style="padding:12px 4px;color:#888;">目前沒有符合的蔬菜</div>';
    return;
  }

  list.innerHTML = filtered.map(product => `
    <a
      href="?id=${product.id}"
      style="
        display:flex;
        align-items:center;
        gap:12px;
        padding:10px;
        margin:8px 0;
        background:#fff;
        border:1px solid #e5e5e5;
        border-radius:12px;
        text-decoration:none;
        color:#333;
      "
    >
      ${
        product.image_url
          ? `<img src="${product.image_url}"
              style="width:58px;height:58px;object-fit:cover;border-radius:10px;">`
          : ""
      }

      <div>
        <div style="font-weight:700;font-size:16px;">
          ${product.variety || "未命名"}
        </div>
        <div style="font-size:13px;color:#777;margin-top:3px;">
          ${product.category || "未分類"}
          ${product.origin ? `・${product.origin}` : ""}
        </div>
      </div>
    </a>
  `).join("");
}

document.getElementById("productSearch").addEventListener("input", () => {
  document.getElementById("productList").style.display = "block";
  renderProductList();
});

document.querySelectorAll(".categoryBtn").forEach(button => {
  button.style.border = "1px solid #4d8d45";
  button.style.background = "#fff";
  button.style.color = "#3d7d36";
  button.style.padding = "8px 13px";
  button.style.borderRadius = "18px";
  button.style.cursor = "pointer";
  button.style.flex = "0 0 auto";

  button.addEventListener("click", () => {
    activeCategory = button.dataset.category;

    document.querySelectorAll(".categoryBtn").forEach(btn => {
      btn.style.background = "#fff";
      btn.style.color = "#3d7d36";
    });

    button.style.background = "#4d8d45";
    button.style.color = "#fff";
document.getElementById("productList").style.display = "block";
    renderProductList();
  });
});

loadProductBrowser();  

</script>

</body>
</html>
